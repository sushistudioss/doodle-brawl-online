const BASS=[36,33,41,43],MEL=[[0,99,4,99,7,99,4,99,9,99,7,99,4,99,2,99],[9,99,7,99,4,99,7,99,9,99,12,99,9,99,7,12],[5,99,9,99,12,99,9,99,5,99,9,99,7,99,4,99],[7,99,11,99,14,99,12,99,11,99,7,99,5,99,2,99]];
function sched(){if(!AC||mute||AC.state!='running')return;const w=W.ph,fast=w=='cd'||w=='play'||w=='res',sp=60/(fast?(W.g==3?166:150):104)/4;if(nt<AC.currentTime-.3)nt=AC.currentTime+.05;
 while(nt<AC.currentTime+.15){const s=st%16,bar=(st>>4)%4,t=nt,b=BASS[bar];
  if(fast?s%4==0:(s==0||s==10))tone(150,t,.13,'sine',.9,MU,45);if(s==4||s==12)nz(t,.1,.32,1500);if(fast?s%2==0:s%4==2)nz(t,.03,.1,7000);

for(let i=0;i<6000;i++){g.fillStyle='rgba(120,100,60,'+Math.random()*.07+')';g.fillRect(Math.random()*1280,Math.random()*720,2,2)}

g.strokeStyle='#e57b7b';g.lineWidth=2;g.beginPath();g.moveTo(96,0);g.lineTo(96,720);g.stroke();
g.fillStyle='#d6cdb2';for(const y of[120,360,600]){g.beginPath();g.arc(40,y,12,0,7);g.fill()}
g.strokeStyle='rgba(120,70,30,.18)';g.lineWidth=6;g.beginPath();g.arc(1130,620,38,0,5.6);g.stroke();
g.save();g.translate(1250,14);g.rotate(.8);g.fillStyle='rgba(255,226,120,.75)';g.fillRect(-44,-10,88,24);g.restore();
const v=g.createRadialGradient(640,360,320,640,360,820);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(80,60,20,.28)');g.fillStyle=v;g.fillRect(0,0,1280,720)})();
function doodles(cx){x.strokeStyle='#cfc8b0';x.lineWidth=2.5;for(let i=0;i<7;i++){const dx=((i*220-T*7-cx*.3)%1500+1500)%1500-110,dy=90+(i*131)%460;x.beginPath();
 if(i%3==0)x.arc(dx,dy,24,0,7);else if(i%3==1){x.moveTo(dx-20,dy);x.lineTo(dx,dy-26);x.lineTo(dx+20,dy);x.closePath()}else for(let a=0;a<12;a+=.4)x.lineTo(dx+Math.cos(a)*a*2.4,dy+Math.sin(a)*a*2.4);x.stroke()}}
/* ---------- sketch helpers & stickman ---------- */
function J(){return Math.sin(js++*12.9898+Math.floor(T*10)*78.2)*1.5}
function seg(g,a,b,c,d,w){g.lineWidth=w;g.beginPath();g.moveTo(a+J(),b+J());g.lineTo(c+J(),d+J());g.stroke()}
function man(g,cf,px,py,ph,dir,o){o=o||{};const s=Math.sin(ph),sy=1+Math.min(.22,Math.abs(o.vy||0)/3500),sx=1/sy,a=o.air?.6:s,col=o.ko?'#9a9a9a':COLS[cf.c],up=o.air?-14:0;
 g.save();g.translate(px,py);g.scale(sx,sy);if(o.rot){g.translate(0,-25);g.rotate(o.rot*dir);g.translate(0,25)}g.lineCap=g.lineJoin='round';js=0;
 const rg=o.rg,L=rg?[[rg.N[0],rg.N[1],rg.H[0],rg.H[1],6],[rg.H[0],rg.H[1],rg.FL[0],rg.FL[1],6],[rg.H[0],rg.H[1],rg.FR[0],rg.FR[1],6],[rg.N[0],rg.N[1],rg.HL[0],rg.HL[1],5],[rg.N[0],rg.N[1],rg.HR[0],rg.HR[1],5]]:[[0,-34,0,-16,6],[0,-16,-8+a*10,0,6],[0,-16,8-a*10,0,6],[0,-30,-13-a*8,-17+up,5],[0,-30,13+a*8,-17+up,5]];
 for(const pass of[0,1])for(const l of L){g.strokeStyle=pass?col:INK;seg(g,l[0],l[1],l[2],l[3],l[4]+(pass?0:4))}
 g.fillStyle=INK;for(const f of rg?[rg.FL,rg.FR]:[[-8+a*10,0],[8-a*10,0]]){g.beginPath();g.ellipse(f[0]+dir*2,f[1],6,3,0,0,7);g.fill()}
 g.save();if(rg){g.translate(rg.Hd[0],rg.Hd[1]);g.rotate(Math.atan2(rg.Hd[0]-rg.N[0],rg.N[1]-rg.Hd[1]));g.translate(0,47)}
 g.fillStyle='#fffdf5';g.strokeStyle=INK;g.lineWidth=3.5;g.beginPath();g.arc(0,-47,14,0,7);g.fill();g.stroke();
 g.fillStyle='rgba(255,120,140,.35)';g.beginPath();g.arc(dir*7,-42,3.5,0,7);g.fill();
 g.strokeStyle=g.fillStyle=INK;g.lineWidth=2;const e=dir*3,f=o.ko?3:cf.f;
 for(const q of[-5,5]){const ex=e+q,ey=-49;g.beginPath();
  if(f==0){g.arc(ex,ey,2,0,7);g.fill()}else if(f==1){g.arc(ex,ey,3.6,0,7);g.stroke();g.beginPath();g.arc(ex+dir,ey,1.3,0,7);g.fill()}
  else if(f==2){g.arc(ex,ey,2,0,7);g.fill();g.beginPath();g.moveTo(ex-3,ey-(q<0?6:3));g.lineTo(ex+3,ey-(q<0?3:6));g.stroke()}
  else{g.moveTo(ex-3,ey-3);g.lineTo(ex+3,ey+3);g.moveTo(ex+3,ey-3);g.lineTo(ex-3,ey+3);g.stroke()}}

function plat(q,c,cx){cx=cx||0;const h=Math.min(40,720-q[1]);x.fillStyle='rgba(0,0,0,.13)';x.fillRect(q[0]+7,q[1]+9,q[2],h);x.fillStyle='#fffaf0';x.fillRect(q[0],q[1],q[2],h);

/* ---------- particles ---------- */
function burst(px,py,n,c,t){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:(Math.random()-.5)*420,vy:-Math.random()*420,l:.6+Math.random()*.5,c,t,r:Math.random()*6})}
function bonk(px,py,tx){fx.push({x:px,y:py-70,vx:0,vy:-30,l:.8,t:2,tx})}
function detect(pl){pl.forEach((p,i)=>{const o=prev[i];if(!o)return;
 if(p[5]&&!o[5]){bonk(p[0],p[1],'BONK!');burst(p[0],p[1]-30,10,'#f2b705',1);shake=9;beep(160,.15)}
 if(p[4]&&!o[4]){burst(p[0],Math.min(p[1],690),14,'#999',0);beep(120,.25)}
 if(p[6]>o[6]){burst(p[0],p[1]-30,8,'#f7c600',1);beep(900,.08)}
 if(p[9]!==o[9]){FLT[i]=.5;burst(p[0],p[1]-10,8,'#bbb',0);beep(760,.09)}
 if(o[8]>500&&p[8]<60&&!p[4])burst(p[0],p[1],5,'#bbb',0)});prev=pl.map(p=>p.slice())}
function drawFx(){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.l-=1/60;if(f.l<=0){fx.splice(i,1);continue}f.x+=f.vx/60;f.y+=f.vy/60;f.vy+=(f.t>=2?0:600)/60;
 x.globalAlpha=Math.min(1,f.l*2);
 if(f.t==2){x.save();x.translate(f.x,f.y);x.rotate(-.1);x.font='30px '+FONT;const w=x.measureText(f.tx).width+20;x.fillStyle='#fff';x.strokeStyle=INK;x.lineWidth=3;x.beginPath();x.roundRect(-w/2,-26,w,40,14);x.fill();x.stroke();x.fillStyle='#e63946';x.textAlign='center';x.fillText(f.tx,0,4);x.restore()}
 else if(f.t==0||f.t==3){x.fillStyle=f.c;x.beginPath();x.arc(f.x,f.y,5+f.l*6,0,7);x.fill()}

/* ---------- ragdoll (verlet, render-side so host and clients all see it) ---------- */
const RG=[],FLT=[],RC=[['H','N',16,1],['N','Hd',15,1],['N','HL',20,1],['N','HR',20,1],['H','FL',18,1],['H','FR',18,1],['H','Hd',31,.3],['HL','HR',36,.1],['FL','FR',18,.2]];
function rgInit(d,vx,vy){const o=(a,b)=>({x:d.x+a,y:d.y+b,px:d.x+a-vx/60,py:d.y+b-vy/60});return{H:o(0,-16),N:o(0,-32),Hd:o(0,-47),HL:o(-13,-20),HR:o(13,-20),FL:o(-8,0),FR:o(8,0)}}
function rgStep(r,d,pf,c){for(const k in r){const p=r[k],vx=(p.x-p.px)*.99,vy=(p.y-p.py)*.99;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+.45}
 if(!c){r.H.x+=(d.x-r.H.x)*.3;r.H.y+=(d.y-16-r.H.y)*.2}
 for(let n=0;n<4;n++){for(const[a,b,l,s]of RC){const A=r[a],B=r[b],dx=B.x-A.x,dy=B.y-A.y,ds=Math.hypot(dx,dy)||1,f=(ds-l)/ds*.5*s;A.x+=dx*f;A.y+=dy*f;B.x-=dx*f;B.y-=dy*f}
